<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
    <!-- viewport-fit=cover låter appen gå ut i kanterna på telefoner med
         hak; safe-area-marginalerna i CSS:en håller innehållet innanför -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />

    <!-- Lägg till på hemskärmen: utan det här öppnas Hubben som en webbsida
         med adressfält i stället för som en app -->
    <link rel="manifest" href="/hubben/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/hubben/ikoner/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hubben" />
    <title>Hubben</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
